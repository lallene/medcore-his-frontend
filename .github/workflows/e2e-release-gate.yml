name: MedCore QA Release Gate

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Playwright suite
        required: true
        default: critical
        type: choice
        options: [smoke, critical, full]
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: medcore-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medcore_full_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d medcore_full_demo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medcore_full_demo?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medcore_full_demo?sslmode=disable
      JWT_SECRET: qa-ci-ephemeral-not-production
      APP_ENV: test
      PORT: '8080'
      PUBLIC_API_URL: http://127.0.0.1:8080
      QA_BASE_URL: http://127.0.0.1:4173
      QA_API_URL: http://127.0.0.1:8080
      QA_ADMIN_EMAIL: admin@medcore.local
      QA_ADMIN_PASSWORD: admin123
      QA_ENVIRONMENT: ci
      QA_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      QA_SUITE: ${{ inputs.suite || 'critical' }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with: { path: frontend }
      - name: Checkout backend main
        uses: actions/checkout@v4
        with:
          repository: lallene/medcore-his
          ref: main
          path: backend
          token: ${{ secrets.MEDCORE_BACKEND_READ_TOKEN || github.token }}
      - name: Verify backend revision
        working-directory: backend
        run: |
          echo "=== BACKEND REVISION ==="
          git rev-parse HEAD
          git log -3 --oneline
          echo "=== AnyPermission ==="
          grep -RIn "func AnyPermission" internal/core/rbac || true
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Migrate ephemeral QA database
        working-directory: backend
        run: go run ./cmd/migrate
      - name: Backend unit gate
        working-directory: backend
        env:
          TEST_DATABASE_URL: ''
        run: |
          go test ./...
          go vet ./...

      - name: Ticketing PostgreSQL integration gate
        working-directory: backend
        run: go test ./internal/modules/ticketing/...
      - name: Seed ephemeral DEMO database
        working-directory: backend
        run: go run ./cmd/seed --demo-full
      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p ../frontend/test-results/logs
          go run ./cmd/api > ../frontend/test-results/logs/backend-qa.log 2>&1 &
      - name: Wait for backend health
        run: for i in {1..60}; do curl --fail --silent http://127.0.0.1:8080/health && exit 0; sleep 1; done; exit 1

      - name: Verify QA admin authentication
        run: |
          echo "=== QA ADMIN USER ==="
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -U postgres \
            -d medcore_full_demo \
            -c "SELECT id,email,is_active,role FROM users WHERE email='admin@medcore.local';"

          echo "=== QA ADMIN LOGIN ==="
          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@medcore.local","password":"admin123"}' \
            http://127.0.0.1:8080/api/auth/login
      - name: Frontend quality gate
        working-directory: frontend
        run: npm ci && npm test && npm run check && npm run lint && npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          mkdir -p test-results/logs
          npm run preview -- --host 127.0.0.1 --port 4173 > test-results/logs/frontend-qa.log 2>&1 &
      - name: Wait for frontend
        run: for i in {1..60}; do curl --fail --silent http://127.0.0.1:4173/login >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Run Playwright release gate
        id: playwright
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test
      - name: Import campaign metadata into ephemeral QA database
        if: always() && hashFiles('frontend/test-results/qa-summary.json') != ''
        working-directory: backend
        run: go run ./cmd/qa-import ../frontend/test-results/qa-summary.json
      - name: Collect QA diagnostics
        if: always()
        run: |
          mkdir -p frontend/test-results/logs

          if [ ! -f frontend/test-results/logs/backend-qa.log ]; then
            echo "backend-qa.log was not generated because the backend start step was not reached or did not create the log." \
              > frontend/test-results/logs/backend-qa.log
          fi

          if [ ! -f frontend/test-results/logs/frontend-qa.log ]; then
            echo "frontend-qa.log was not generated because the frontend start step was not reached or did not create the log." \
              > frontend/test-results/logs/frontend-qa.log
          fi

          echo "=== QA evidence ==="
          find frontend/test-results -maxdepth 3 -type f -print || true
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medcore-qa-${{ env.QA_RUN_ID }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - name: Enforce Playwright gate
        if: steps.playwright.outcome == 'failure'
        run: exit 1
